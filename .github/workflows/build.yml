name: Build Tweak (MacOS Native)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # ✅ 核心：继续使用 macos-latest，利用系统自带编译器，避开工具链下载问题
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install dpkg ldid wget || brew install dpkg ldid wget

      - name: Setup Theos & Environment
        run: |
          THEOS_PATH="$HOME/theos"
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH

          # 克隆 Theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS_PATH

          # 下载 SDK (注意：这里依然使用你之前的源，如果这个源失效，见方案二)
          # 但为了支持 iOS 26/27，建议手动指定一个较新的 SDK 链接，或者保留原样碰碰运气
          mkdir -p $THEOS_PATH/sdks
          wget -qO- https://github.com/theos/sdks/archive/master.zip | bsdtar -xvf- -C $THEOS_PATH/sdks --strip-components=1

      - name: Build Tweak
        run: |
          # ✅ 关键：在这里强制指定最低版本为 15.0
          # 这样即使是用 Mac 自带编译器，也会加上 -miphoneos-version-min=15.0 参数
          export TARGET="iphone:clang:latest:15.0"

          make clean
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Tweak-Package
          path: packages/*.deb
