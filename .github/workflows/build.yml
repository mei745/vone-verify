name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest # 使用 Ubuntu 虚拟机

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Theos
      run: |
        sudo apt-get update
        sudo apt-get install -y git dpkg-dev libssl-dev
        
        # 下载脚本
        curl -sLO https://raw.githubusercontent.com/theos/theos/master/bin/install-theos
        # 赋予执行权限
        chmod +x install-theos
        # 运行安装 (加上 -y 自动确认)
        bash ./install-theos -y
        
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Build Package
      run: make package FINALPACKAGE=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vone-verify-deb
        path: packages/*.deb
