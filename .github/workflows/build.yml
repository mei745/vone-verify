name: Build Tweak (iOS 16.2)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive # 必须开启递归克隆，否则 Theos 不完整

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl rsync zip unzip libssl-dev libcurl4-openssl-dev

    - name: Setup Theos & iOS 16.2 SDK
  run: |
    git clone --recursive https://github.com/theos/theos.git $HOME/theos
    mkdir -p $HOME/theos/sdks
    curl -L https://github.com/theos/sdks/releases/download/16.2/iPhoneOS16.2.sdk.tar.xz -o $HOME/theos/sdks/iPhoneOS16.2.sdk.tar.xz
    tar -xf $HOME/theos/sdks/iPhoneOS16.2.sdk.tar.xz -C $HOME/theos/sdks/
    rm $HOME/theos/sdks/iPhoneOS16.2.sdk.tar.xz
    - name: Build Tweak
      env:
        THEOS: $HOME/theos
        # 指定使用 iOS 16.2 SDK
        TARGET: iphone:clang:latest:16.2 
      run: |
        cd $GITHUB_WORKSPACE
        make package FINALPACKAGE=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tweak-Package
        path: packages/*.deb
