name: Build Tweak (Fixed Toolchain URL)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos
  TARGET: iphone:clang:latest:15.0
  ARCHS: arm64 arm64e

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies & ldid
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential dpkg-dev libssl-dev perl python3 ruby xz-utils git curl
        # 安装 ldid
        curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
        chmod +x ldid_linux_x86_64
        sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $THEOS

    - name: Setup iOS 16.2 SDK
      run: |
        mkdir -p $THEOS/sdks
        git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
        cp -R /tmp/ios-sdks/iPhoneOS16.2.sdk $THEOS/sdks/
        rm -rf /tmp/ios-sdks

    - name: Setup Toolchain (Fixed)
      run: |
        # 修正点：使用实际存在的文件名 (15-0-0 而不是 15.0.0)
        TOOLCHAIN_URL="https://github.com/ProcursusTeam/procursus/releases/download/v170/iphoneos-clang-15-0-0-darwin23-x86_64.tar.xz"
        
        echo "Downloading toolchain..."
        # 增加 -v 参数显示详细错误，方便排查
        curl -L -o /tmp/toolchain.tar.xz -v --fail "$TOOLCHAIN_URL"
        
        FILE_SIZE=$(stat -c%s "/tmp/toolchain.tar.xz")
        if [ "$FILE_SIZE" -lt 1000 ]; then
          echo "Error: File too small. Check the URL."
          exit 1
        fi
        
        echo "Extracting toolchain..."
        tar -xf /tmp/toolchain.tar.xz -C $THEOS
        rm -f /tmp/toolchain.tar.xz

    - name: Build Tweak
      run: |
        cd ${{ github.workspace }}
        make package FINALPACKAGE=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tweak-package
        path: packages/*.deb
