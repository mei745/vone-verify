name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl rsync zip unzip libssl-dev libcurl4-openssl-dev

    - name: Setup Theos & Download SDK
      run: |
        # 1. 克隆 Theos
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        export THEOS=$HOME/theos
        echo "THEOS=$THEOS" >> $GITHUB_ENV

        # 2. 下载 iOS 16.5 SDK (稳定版)
        mkdir -p $THEOS/sdks
        # 使用 xybp888 的稳定镜像
        curl -L -o /tmp/iPhoneOS16.5.sdk.tar.xz \
          "https://github.com/xybp888/iOS-SDKs/raw/main/iPhoneOS16.5.sdk.tar.xz"
        
        # 检查文件大小，防止下载失败
        if [ $(stat -c%s "/tmp/iPhoneOS16.5.sdk.tar.xz") -lt 100000000 ]; then
          echo "Error: SDK file is too small, download failed."
          exit 1
        fi

        tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
        rm /tmp/iPhoneOS16.5.sdk.tar.xz

    - name: Build Package
      run: |
        make clean
        make package FINALPACKAGE=1
      env:
        THEOS: ${{ env.THEOS }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoneVerify-Tweak
        path: packages/*.deb
