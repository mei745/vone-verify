name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl rsync zip unzip libssl-dev libcurl4-openssl-dev

    - name: Setup Theos & Download SDK
      run: |
        # 1. 克隆 Theos
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        export THEOS=$HOME/theos
        echo "THEOS=$THEOS" >> $GITHUB_ENV

        # 2. 下载 iOS SDK (使用 xybp888 的稳定镜像)
        mkdir -p $THEOS/sdks
        echo "Downloading iOS 16.5 SDK..."
        curl -L -o /tmp/iPhoneOS16.5.sdk.tar.xz \
          "https://github.com/xybp888/iOS-SDKs/raw/main/iPhoneOS16.5.sdk.tar.xz"

        # 3. 校验文件大小 (防止下载到 404 页面)
        FILE_SIZE=$(stat -c%s "/tmp/iPhoneOS16.5.sdk.tar.xz")
        if [ "$FILE_SIZE" -lt 100000000 ]; then
          echo "Error: SDK download failed! File size is only $FILE_SIZE bytes."
          exit 1
        fi

        tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
        rm /tmp/iPhoneOS16.5.sdk.tar.xz

    - name: Build Package
      run: |
        make clean
        make package FINALPACKAGE=1
      env:
        THEOS: ${{ env.THEOS }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoneVerify-Tweak
        path: packages/*.deb
