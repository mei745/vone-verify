name: Build Tweak (Auto-Fix Version)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码 (必须开启 recursive 以拉取 theos 子模块)
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. 自动配置 Theos 环境 (包含 ldid, toolchain, sdk)
    # 这一步由社区维护的大神编写，完美解决了下载失败和格式错误的问题
    - name: Setup Theos Environment
      uses: dhinakg/theos-action@main
      with:
        # 这里指定你要用的 SDK 版本，如果没有会自动下载
        sdk-version: "16.2"

    # 3. 编译项目
    - name: Build Tweak
      run: |
        make package FINALPACKAGE=1
      env:
        THEOS: ${{ github.workspace }}/theos
        # 根据你的需求调整最低兼容版本
        TARGET: iphone:clang:latest:15.0
        ARCHS: arm64 arm64e

    # 4. 上传产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoneVerify-Tweak
        path: packages/*.deb
