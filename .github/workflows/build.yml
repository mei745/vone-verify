name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest # 使用 Ubuntu 虚拟机

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Theos
      run: |
        # 1. 更新源并安装基础依赖
        sudo apt-get update
        sudo apt-get install -y git dpkg-dev libssl-dev
        
        # 2. 使用 Theos 官方脚本自动安装 ldid 和 Theos
        bash <(curl -s https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)
        
        # 3. 设置环境变量
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Build Package
      run: make package FINALPACKAGE=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vone-verify-deb
        path: packages/*.deb
