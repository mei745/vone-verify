name: Build Tweak (iOS 16.2 SDK + Toolchain)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 【关键】定义全局环境变量
env:
  THEOS: ${{ github.workspace }}/theos
  # 使用 iPhoneOS16.2.sdk，最低兼容版本设为 15.0
  TARGET: iphone:clang:latest:15.0
  ARCHS: arm64 arm64e

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # 1. 安装基础依赖
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl rsync zip unzip libssl-dev libcurl4-openssl-dev clang make dpkg-dev ldid

    # 2. 克隆 Theos 框架
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $THEOS

    # 3. 【核心修复】下载并配置 Linux 专用 Toolchain
    # Theos 默认不带编译器，必须手动下载 Procursus Toolchain
    - name: Setup Toolchain
      run: |
        TOOLCHAIN_DIR="$THEOS/toolchain/linux/iphone"
        mkdir -p "$TOOLCHAIN_DIR"

        # 下载最新的 Linux x86_64 Toolchain (Procursus)
        # 注意：这个链接可能会随时间更新，如果失效请去 https://github.com/ProcursusTeam/Procursus 查找最新 release
        echo "Downloading toolchain..."
        curl -L -o toolchain.tar.xz https://github.com/ProcursusTeam/Procursus/releases/download/v170/linux-x86_64-ios-llvm-14.0.0+5.tar.xz

        # 解压到指定目录
        tar -xf toolchain.tar.xz -C "$TOOLCHAIN_DIR" --strip-components=1

        # 验证 clang 是否存在
        ls -la "$TOOLCHAIN_DIR/bin/clang"

    # 4. 下载 iOS 16.2 SDK
    - name: Setup iOS 16.2 SDK
      run: |
        mkdir -p $THEOS/sdks

        # 使用 sparse checkout 仅拉取 iPhoneOS16.2.sdk
        git init temp_sdk
        cd temp_sdk
        git remote add origin https://github.com/xybp888/iOS-SDKs.git
        git config core.sparseCheckout true
        echo "iPhoneOS16.2.sdk" >> .git/info/sparse-checkout
        git pull --depth 1 origin master

        # 移动 SDK 到 Theos 目录
        mv iPhoneOS16.2.sdk $THEOS/sdks/
        cd ..
        rm -rf temp_sdk

    # 5. 编译项目
    - name: Build Tweak
      run: |
        # 打印环境信息用于调试
        echo "Current Directory: $(pwd)"
        echo "THEOS Path: $THEOS"
        echo "Target: $TARGET"
        echo "Clang Path: $THEOS/toolchain/linux/iphone/bin/clang"

        # 执行编译
        make package FINALPACKAGE=1

    # 6. 上传产物
    - uses: actions/upload-artifact@v4
      with:
        name: VoneVerify-Package
        path: packages/*.deb
