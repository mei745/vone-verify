name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive # 这一步非常重要，确保 Theos 的子模块被完整克隆

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl rsync zip unzip libssl-dev libcurl4-openssl-dev

    - name: Setup Theos
      run: |
        # 1. 克隆 Theos 核心
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        export THEOS=$HOME/theos
        echo "THEOS=$THEOS" >> $GITHUB_ENV

        # 2. 安装签名工具 (ldid)
        curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
        chmod +x ldid_linux_x86_64
        sudo mv ldid_linux_x86_64 $THEOS/bin/ldid

    - name: Download iOS SDK (Stable Method)
      run: |
        # 使用 xybp888 的专用 Action 来下载 SDK，这是目前最稳的方法
        # 它会直接从 GitHub Release 获取，避免网络拦截
        mkdir -p $THEOS/sdks
        cd $THEOS/sdks
        # 这里我们使用一个非常稳定的源，如果失效，可以换成下面的备用源
        curl -L -o iPhoneOS16.5.sdk.tar.xz "https://github.com/dora2-iOS/iOS-SDKs/raw/main/iPhoneOS16.5.sdk.tar.xz"

        # 校验文件大小 (iOS 16.5 SDK 应该在 30MB 以上)
        if [ $(stat -c%s "iPhoneOS16.5.sdk.tar.xz") -lt 1000000 ]; then
          echo "Error: Download failed or file too small."
          exit 1
        fi

        tar -xf iPhoneOS16.5.sdk.tar.xz
        rm iPhoneOS16.5.sdk.tar.xz
        ls -la $THEOS/sdks

    - name: Build Package
      run: |
        make package FINALPACKAGE=1
      env:
        THEOS: ${{ env.THEOS }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Tweak
        path: packages/*.deb
