name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl rsync zip unzip libssl-dev libcurl4-openssl-dev

    - name: Setup Theos & Download SDK
      run: |
        # 1. 克隆 Theos 仓库
        echo "Cloning Theos..."
        git clone --recursive https://github.com/theos/theos.git $HOME/theos

        # 2. 设置 THEOS 环境变量
        export THEOS=$HOME/theos
        echo "THEOS=$THEOS" >> $GITHUB_ENV

        # 3. 下载 iOS SDK (关键修复步骤)
        # 使用 xybp888 维护的稳定镜像源，避免 GitHub 链接失效问题
        echo "Downloading iOS SDK..."
        mkdir -p $THEOS/sdks

        # 定义 SDK 文件名和下载链接
        SDK_FILE="iPhoneOS16.5.sdk.tar.xz"
        SDK_URL="https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS16.5.sdk.tar.xz"

        # 下载文件
        curl -L "$SDK_URL" -o "$THEOS/sdks/$SDK_FILE"

        # 【重要】校验文件大小，防止下载到 404 页面
        FILE_SIZE=$(stat -c%s "$THEOS/sdks/$SDK_FILE")
        if [ "$FILE_SIZE" -lt 10000000 ]; then
            echo "::error::Download failed! File size is too small ($FILE_SIZE bytes). It's likely a 404 page."
            exit 1
        fi

        # 解压 SDK
        echo "Extracting SDK..."
        tar -xf "$THEOS/sdks/$SDK_FILE" -C $THEOS/sdks
        rm "$THEOS/sdks/$SDK_FILE" # 删除压缩包以节省空间

        echo "Theos setup complete."

    - name: Build Package
      run: make package FINALPACKAGE=1
      env:
        THEOS: ${{ env.THEOS }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoneVerify-Tweak
        path: packages/*.deb
