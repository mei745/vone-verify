name: Build Tweak (iOS 16.2)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive # 必须开启递归克隆，否则 Theos 不完整

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl rsync zip unzip libssl-dev libcurl4-openssl-dev

    - name: Setup Theos & iOS 16.2 SDK
      run: |
        # 1. 安装 Theos
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        
        # 2. 创建 SDK 存放目录
        mkdir -p $HOME/theos/sdks
        
        # 3. 克隆你找到的 iOS 16.2 SDK (使用浅克隆加快速度)
        # 注意：这里使用的是 blackXmask/iPhoneOS16.2.sdk
        git clone --depth 1 https://github.com/blackXmask/iPhoneOS16.2.sdk.git $HOME/theos/sdks/iPhoneOS16.2.sdk
        
        # 4. 验证 SDK 是否存在关键文件
        if [ ! -f "$HOME/theos/sdks/iPhoneOS16.2.sdk/System/Library/Frameworks/UIKit.framework/UIKit" ]; then
          echo "错误：SDK 下载不完整或缺失关键文件！"
          exit 1
        fi
        echo "SDK 准备就绪：iPhoneOS16.2.sdk"

    - name: Build Tweak
      env:
        THEOS: $HOME/theos
        # 指定使用 iOS 16.2 SDK
        TARGET: iphone:clang:latest:16.2 
      run: |
        cd $GITHUB_WORKSPACE
        make package FINALPACKAGE=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tweak-Package
        path: packages/*.deb
