name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl rsync zip unzip libssl-dev libcurl4-openssl-dev

    - name: Setup Theos & Download SDK
      run: |
        # 1. 克隆 Theos 仓库
        echo "Cloning Theos..."
        git clone --recursive https://github.com/theos/theos.git $HOME/theos

        # 2. 设置 THEOS 环境变量
        export THEOS=$HOME/theos
        echo "THEOS=$THEOS" >> $GITHUB_ENV

        # 3. 下载 iOS SDK (关键修复步骤)
        # 使用 Xcode 官方提取的 SDK，来源稳定，支持 iOS 17+
        echo "Downloading iPhoneOS17.5.sdk..."
        mkdir -p $THEOS/sdks
        curl -L -o /tmp/iPhoneOS17.5.sdk.tar.xz \
          "https://github.com/arichornlover/sdks/raw/main/iPhoneOS17.5.sdk.tar.xz"

        # 4. 解压 SDK
        tar -xJf /tmp/iPhoneOS17.5.sdk.tar.xz -C $THEOS/sdks
        ls -la $THEOS/sdks # 打印确认 SDK 是否已存在

    - name: Build Package
      run: make package FINALPACKAGE=1
      env:
        THEOS: ${{ env.THEOS }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoneVerify-Tweak
        path: packages/*.deb
