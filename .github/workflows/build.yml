name: Build Tweak (Fixed SDK Download)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos
  TARGET: iphone:clang:latest:15.0
  ARCHS: arm64 arm64e

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies & ldid
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential dpkg-dev libssl-dev perl python3 ruby xz-utils git curl
        # 安装 ldid (使用 Procursus 稳定源)
        curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
        chmod +x ldid_linux_x86_64
        sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $THEOS

    - name: Setup iOS 16.2 SDK
      run: |
        mkdir -p $THEOS/sdks
        # 关键修复：添加 -L 参数以跟随重定向，并使用稳定的备份源
        curl -L -o /tmp/iPhoneOS16.2.sdk.tar.xz https://github.com/arichornlover/uikit-hosted/raw/main/iPhoneOS16.2.sdk.tar.xz
        tar -xf /tmp/iPhoneOS16.2.sdk.tar.xz -C $THEOS/sdks
        rm /tmp/iPhoneOS16.2.sdk.tar.xz

    - name: Setup Toolchain
      run: |
        # 下载 LLVM Toolchain (Procursus Team)
        curl -L -o /tmp/procursus-toolchain.tar.xz https://github.com/ProcursusTeam/procursus/releases/download/bootstrap-2023-11-26/darwin-arm64-16A242d-bootstrap.tar.xz
        # 注意：这里假设是编译 arm64/arm64e，如果是 x86_64 环境需要调整 toolchain 路径或名称
        # 为了通用性，我们通常直接使用系统 clang 配合 theos 的 makefile 规则，或者下载特定的 linux toolchain
        # 这里使用最通用的 linux x86_64 toolchain 适配 GitHub Actions
        curl -L -o /tmp/toolchain.tar.xz https://github.com/ProcursusTeam/procursus/releases/download/v3.0/linux-x86_64-darwin-toolchain-14.0.0.tar.xz
        tar -xf /tmp/toolchain.tar.xz -C $THEOS/toolchains
        mv $THEOS/toolchains/procursus* $THEOS/toolchains/Xcode14.xctoolchain
        rm /tmp/toolchain.tar.xz

    - name: Build Tweak
      run: |
        cd ${{ github.workspace }}
        # 确保环境变量正确传递
        export THEOS=$THEOS
        export PATH="$THEOS/toolchains/Xcode14.xctoolchain/usr/bin:$PATH"
        make package FINALPACKAGE=1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tweak-Package
        path: packages/*.deb
