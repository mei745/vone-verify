name: Build Tweak

on:
  push:
    branches: [ main ] # 或者 master，取决于你的分支名
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl rsync zip unzip libssl-dev libcurl4-openssl-dev

    - name: Setup Theos & Download SDK
      run: |
        # 1. 克隆 Theos 主程序
        echo "Cloning Theos..."
        git clone --recursive https://github.com/theos/theos.git $HOME/theos

        # 设置环境变量
        export THEOS=$HOME/theos
        echo "THEOS=$THEOS" >> $GITHUB_ENV

        # 2. 创建 SDK 目录
        mkdir -p $THEOS/sdks

        # 3. 下载 iOS SDK (使用稳定的 xybp888 镜像)
        # 这里使用的是 iPhoneOS16.5.sdk，非常稳定且兼容性好
        echo "Downloading iOS 16.5 SDK..."
        curl -L -o /tmp/iPhoneOS16.5.sdk.tar.xz \
          "https://github.com/xybp888/iOS-SDKs/raw/main/iPhoneOS16.5.sdk.tar.xz"

        # 检查文件大小，确保下载成功（防止再次下载到 404 页面）
        FILE_SIZE=$(stat -c%s "/tmp/iPhoneOS16.5.sdk.tar.xz")
        if [ "$FILE_SIZE" -lt 100000000 ]; then
          echo "Error: Downloaded file is too small ($FILE_SIZE bytes). Likely a 404 page."
          exit 1
        fi

        # 解压 SDK
        tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
        rm /tmp/iPhoneOS16.5.sdk.tar.xz

        echo "Theos and SDK setup complete."

    - name: Build Package
      run: |
        make clean
        make package FINALPACKAGE=1
      env:
        THEOS: ${{ env.THEOS }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoneVerify-Tweak
        path: packages/*.deb
