name: Build Tweak (Fixed SDK Source)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos
  TARGET: iphone:clang:latest:15.0
  ARCHS: arm64 arm64e

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出你的代码
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. 安装依赖和 ldid
    - name: Install Dependencies & ldid
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential dpkg-dev libssl-dev perl python3 ruby xz-utils git curl
        # 下载并安装 ldid
        curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
        chmod +x ldid_linux_x86_64
        sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

    # 3. 安装 Theos
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $THEOS

    # 4. 【关键修改】从这里下载 SDK
    - name: Setup iOS 16.2 SDK
      run: |
        # 创建 sdks 目录
        mkdir -p $THEOS/sdks

        # 使用 git clone 单独拉取 iPhoneOS16.2.sdk 文件夹
        # --depth 1 表示只下载最新版本，速度快
        # --no-checkout 先不检出版本库，配合 sparse-checkout 只下载指定文件夹
        git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
        cd /tmp/ios-sdks
        git sparse-checkout set iPhoneOS16.2.sdk
        git checkout

        # 移动 SDK 到 Theos 目录
        mv iPhoneOS16.2.sdk $THEOS/sdks/

    # 5. 安装 Toolchain (编译器)
    - name: Setup Toolchain
      run: |
        # 下载 Procursus 团队的 Linux x86_64 Toolchain
        # 注意：这里必须用 -L 跟随跳转，且地址是最新的
        curl -L -o /tmp/toolchain.tar.xz https://github.com/ProcursusTeam/procursus/releases/download/v161/iphoneos-clang-14.0.0-darwin21-x86_64.tar.xz
        tar -xf /tmp/toolchain.tar.xz -C $THEOS

    # 6. 编译
    - name: Build Tweak
      run: |
        make package FINALPACKAGE=1

    # 7. 上传产物
    - uses: actions/upload-artifact@v4
      with:
        name: Tweak-Package
        path: packages/*.deb
