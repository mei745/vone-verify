name: Build Tweak (MacOS + iOS 16.2 SDK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # ✅ 核心：继续使用 macos-latest，利用系统自带编译器，彻底避开工具链下载问题
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install dpkg ldid wget || true

      - name: Setup Theos & iOS 16.2 SDK
        run: |
          THEOS_PATH="$HOME/theos"
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH

          # 1. 克隆 Theos 核心
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS_PATH

          # 2. 下载指定的 iOS 16.2 SDK
          # 使用 Theos 官方提供的标准 SDK 镜像，稳定可靠
          echo "📦 Downloading iPhoneOS16.2.sdk..."
          mkdir -p $THEOS_PATH/sdks
          wget -qO- https://github.com/theos/sdks/releases/download/v1/iPhoneOS16.2.sdk.tar.xz | tar -xJf- -C $THEOS_PATH/sdks

          # 3. 确认 SDK 已就位
          ls -la $THEOS_PATH/sdks

      - name: Build Tweak
        run: |
          # ✅ 关键：强制指定 SDK 版本为 16.2
          # 即使本地有多个 SDK，这里也会精准命中 16.2
          make clean
          make package "SDKVERSION=16.2" TARGET="iphone:clang:latest:15.0"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Tweak-Package
          path: |
            packages/*.deb
            *.deb
