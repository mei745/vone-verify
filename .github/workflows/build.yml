name: Build Tweak (iOS 16.2 SDK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 【修改点 1】在这里定义全局环境变量，确保所有步骤都能读取到 THEOS 路径
env:
  THEOS: ${{ github.workspace }}/theos # 使用绝对路径更稳妥
  TARGET: iphone:clang:latest:15.0     # 保持你的兼容性目标
  ARCHS: arm64 arm64e                  # 建议明确架构

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies & Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl rsync zip unzip libssl-dev libcurl4-openssl-dev clang make dpkg-dev
        
        # 安装 ldid (Procursus Team 维护版)
        curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_aarch64
        chmod +x ldid_linux_aarch64
        sudo mv ldid_linux_aarch64 /usr/local/bin/ldid

    - name: Setup Theos & iOS 16.2 SDK
      run: |
        # 克隆 Theos
        git clone --recursive https://github.com/theos/theos.git $THEOS

        # 创建 SDK 目录
        mkdir -p $THEOS/sdks

        # 使用 Git Sparse Checkout 只下载 iPhoneOS16.2.sdk
        # 注意：这里使用的是 xybp888 的仓库，因为它包含较新的 SDK
        git clone --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
        cd /tmp/ios-sdks
        git sparse-checkout set iPhoneOS16.2.sdk
        git checkout master
        cp -r iPhoneOS16.2.sdk $THEOS/sdks/

        # 验证 SDK 是否存在
        ls $THEOS/sdks/iPhoneOS16.2.sdk/usr/include

    - name: Build Tweak
      run: |
        # 【修改点 2】打印环境变量进行调试
        echo "Current Directory: $(pwd)"
        echo "THEOS Path: $THEOS"
        echo "Target: $TARGET"

        # 检查 tweak.mk 是否存在 (这是报错的关键文件)
        if [ ! -f "$THEOS/makefiles/tweak.mk" ]; then
          echo "Error: tweak.mk not found in $THEOS/makefiles/"
          exit 1
        fi

        # 【修改点 3】显式传递 THEOS 变量给 make 命令
        # 即使全局变量失效，这样写也能保证编译成功
        make package FINALPACKAGE=1 THEOS=$THEOS TARGET=$TARGET ARCHS="$ARCHS"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tweak-Package
        path: packages/*.deb
